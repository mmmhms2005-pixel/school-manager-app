<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔑 أداة توليد أكواد التفعيل</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #0f766e, #115e59);
    min-height: 100vh;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .container {
    background: #fff;
    border-radius: 20px;
    padding: 22px;
    max-width: 500px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  h1 { color: #0f766e; font-size: 20px; margin-bottom: 6px; text-align: center; }
  .subtitle { color: #64748b; font-size: 12px; text-align: center; margin-bottom: 18px; }
  .field { margin-bottom: 14px; }
  label { display: block; color: #1e293b; font-size: 13px; font-weight: bold; margin-bottom: 6px; }
  input, select {
    width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px;
    font-size: 15px; font-family: 'Courier New', monospace;
  }
  input:focus, select:focus { outline: none; border-color: #0f766e; }
  .hint { color: #64748b; font-size: 10px; margin-top: 4px; }
  button {
    width: 100%; padding: 14px; background: #0f766e; color: #fff;
    border: 0; border-radius: 12px; font-size: 16px; font-weight: bold;
    cursor: pointer; font-family: inherit;
  }
  button:active { transform: scale(0.98); }
  button:hover { background: #115e59; }
  .result {
    margin-top: 18px; padding: 16px; background: #f0fdf4;
    border: 2px solid #86efac; border-radius: 12px; display: none;
  }
  .result.visible { display: block; }
  .result-label { color: #166534; font-size: 12px; font-weight: bold; margin-bottom: 8px; }
  .license-key {
    font-family: 'Courier New', monospace; font-size: 16px; font-weight: bold;
    color: #0f766e; text-align: center; padding: 14px;
    background: #fff; border: 2px solid #0f766e; border-radius: 10px;
    letter-spacing: 1px; word-break: break-all; margin-bottom: 10px;
  }
  .actions { display: flex; gap: 8px; }
  .actions button { flex: 1; padding: 10px; font-size: 13px; background: #3b82f6; }
  .actions button:hover { background: #2563eb; }
  .error {
    margin-top: 14px; padding: 12px; background: #fef2f2;
    border: 2px solid #fecaca; border-radius: 10px;
    color: #991b1b; font-size: 13px; font-weight: bold; display: none;
  }
  .error.visible { display: block; }
  .meta {
    margin-top: 10px; padding: 10px; background: #f1f5f9;
    border-radius: 8px; font-size: 11px; color: #475569; line-height: 1.7;
  }
  .info-box {
    margin-bottom: 14px; padding: 10px; background: #eff6ff;
    border: 1px solid #bfdbfe; border-radius: 10px;
    font-size: 11px; color: #1e40af; line-height: 1.6;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🔑 أداة توليد أكواد التفعيل</h1>
  <div class="subtitle">نظام المدرسة الذكي — نسخة البائع</div>

  <div class="info-box">
    📌 هذه الأداة خاصة بالبائع فقط. لا تشاركها مع أحد.
  </div>

  <div class="field">
    <label>📱 كود الجهاز (من العميل):</label>
    <input type="text" id="deviceId" placeholder="A1B2C3D4-E5F6G7H8" maxlength="20" autocomplete="off">
    <div class="hint">أدخل الكود بالصيغة XXXXXXXX-XXXXXXXX</div>
  </div>

  <div class="field">
    <label>⏱️ مدة الترخيص:</label>
    <select id="duration">
      <option value="1">سنة واحدة</option>
      <option value="2">سنتان</option>
      <option value="3">3 سنوات</option>
      <option value="5">5 سنوات</option>
      <option value="10">10 سنوات</option>
    </select>
  </div>

  <button onclick="generate()">⚡ توليد كود التفعيل</button>

  <div class="error" id="errorBox"></div>

  <div class="result" id="resultBox">
    <div class="result-label">✅ كود التفعيل الناتج:</div>
    <div class="license-key" id="licenseKey"></div>
    <div class="actions">
      <button onclick="copyKey()">📋 نسخ الكود</button>
      <button onclick="copyDevice()">📱 نسخ كود الجهاز</button>
    </div>
    <div class="meta" id="metaBox"></div>
  </div>
</div>

<script>
const LICENSE_SECRET = "SM-2026-LICENSE-SECRET-P4Q8R2W9X";
const BASE_MILLIS = 1577836800000;
const DAY_MS = 86400000;

function strToBytes(str) {
  const out = [];
  for (let i = 0; i < str.length; i++) {
    let c = str.charCodeAt(i);
    if (c < 128) out.push(c);
    else if (c < 2048) { out.push(192|(c>>6)); out.push(128|(c&63)); }
    else if (c < 55296 || c >= 57344) {
      out.push(224|(c>>12)); out.push(128|((c>>6)&63)); out.push(128|(c&63));
    } else {
      i++;
      c = 0x10000 + (((c&0x3ff)<<10) | (str.charCodeAt(i)&0x3ff));
      out.push(240|(c>>18)); out.push(128|((c>>12)&63));
      out.push(128|((c>>6)&63)); out.push(128|(c&63));
    }
  }
  return out;
}

function sha256Raw(bytesIn) {
  const bytes = bytesIn.slice();
  const bitLen = bytes.length * 8;
  bytes.push(0x80);
  while ((bytes.length % 64) !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push(Math.floor(bitLen / Math.pow(2, i*8)) & 0xff);

  const K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ];
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const rotr = (x,n) => (x>>>n)|(x<<(32-n));

  for (let i = 0; i < bytes.length; i += 64) {
    const W = new Array(64);
    for (let j = 0; j < 16; j++) {
      W[j] = (bytes[i+j*4]<<24)|(bytes[i+j*4+1]<<16)|(bytes[i+j*4+2]<<8)|bytes[i+j*4+3];
    }
    for (let j = 16; j < 64; j++) {
      const s0 = rotr(W[j-15],7)^rotr(W[j-15],18)^(W[j-15]>>>3);
      const s1 = rotr(W[j-2],17)^rotr(W[j-2],19)^(W[j-2]>>>10);
      W[j] = (W[j-16]+s0+W[j-7]+s1)|0;
    }
    let [a,b,c,d,e,f,g,h] = H;
    for (let j = 0; j < 64; j++) {
      const S1 = rotr(e,6)^rotr(e,11)^rotr(e,25);
      const ch = (e&f)^(~e&g);
      const t1 = (h+S1+ch+K[j]+W[j])|0;
      const S0 = rotr(a,2)^rotr(a,13)^rotr(a,22);
      const maj = (a&b)^(a&c)^(b&c);
      const t2 = (S0+maj)|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  const out = new Uint8Array(32);
  for (let i = 0; i < 8; i++) {
    out[i*4]=(H[i]>>>24)&0xff; out[i*4+1]=(H[i]>>>16)&0xff;
    out[i*4+2]=(H[i]>>>8)&0xff; out[i*4+3]=H[i]&0xff;
  }
  return Array.from(out);
}

function hmacSha256hex(message, secret) {
  const bs = 64;
  let keyBytes = strToBytes(secret);
  if (keyBytes.length > bs) keyBytes = sha256Raw(keyBytes);
  while (keyBytes.length < bs) keyBytes.push(0);
  const ipad = keyBytes.map(b => b ^ 0x36);
  const opad = keyBytes.map(b => b ^ 0x5c);
  const innerHash = sha256Raw(ipad.concat(strToBytes(message)));
  const outerHash = sha256Raw(opad.concat(innerHash));
  return outerHash.map(b => b.toString(16).padStart(2,'0')).join('');
}

function generate() {
  const errBox = document.getElementById('errorBox');
  const resBox = document.getElementById('resultBox');
  errBox.classList.remove('visible');
  resBox.classList.remove('visible');

  let deviceId = document.getElementById('deviceId').value.trim().toUpperCase().replace(/\s/g,'');
  const years = parseInt(document.getElementById('duration').value);

  if (!deviceId) { showErr('❌ الرجاء إدخال كود الجهاز'); return; }

  if (!deviceId.includes('-') && deviceId.length === 16) {
    deviceId = deviceId.substring(0,8) + '-' + deviceId.substring(8);
  }

  if (!/^[A-F0-9]{8}-[A-F0-9]{8}$/.test(deviceId)) {
    showErr('❌ صيغة كود الجهاز غير صحيحة (XXXXXXXX-XXXXXXXX)');
    return;
  }

  const now = Date.now();
  const expiresAt = now + years * 365 * DAY_MS;
  const expiryDays = Math.floor((expiresAt - BASE_MILLIS) / DAY_MS);
  const expiryHex = expiryDays.toString(16).toUpperCase();
  const payload = deviceId + ':' + expiryDays;
  const signature = hmacSha256hex(payload, LICENSE_SECRET).substring(0,8).toUpperCase();

  const clean = deviceId.replace('-','');
  const suffix = clean.slice(-4);
  const sig1 = signature.substring(0,4);
  const sig2 = signature.substring(4,8);
  const licenseKey = 'SM26-' + suffix + '-' + expiryHex + '-' + sig1 + '-' + sig2;

  document.getElementById('licenseKey').textContent = licenseKey;
  const d = new Date(expiresAt);
  document.getElementById('metaBox').innerHTML =
    '📱 كود الجهاز: <strong>' + deviceId + '</strong><br>' +
    '📅 تاريخ الانتهاء: <strong>' + d.toISOString().split('T')[0] + '</strong><br>' +
    '⏱️ المدة: <strong>' + years + ' سنة</strong>';

  resBox.classList.add('visible');
}

function showErr(msg) {
  const e = document.getElementById('errorBox');
  e.textContent = msg;
  e.classList.add('visible');
}

function copyKey() {
  copyToClipboard(document.getElementById('licenseKey').textContent);
}

function copyDevice() {
  copyToClipboard(document.getElementById('deviceId').value.trim().toUpperCase());
}

function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(()=>alert('✅ تم النسخ')).catch(()=>fallbackCopy(text));
  } else fallbackCopy(text);
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); alert('✅ تم النسخ'); }
  catch(e) { alert('❌ انسخ الكود يدوياً'); }
  document.body.removeChild(ta);
}

document.getElementById('deviceId').addEventListener('input', function(e){
  e.target.value = e.target.value.toUpperCase().replace(/[^A-F0-9-]/g,'');
});
document.getElementById('deviceId').addEventListener('keypress', function(e){
  if (e.key === 'Enter') generate();
});
</script>
</body>
</html>
