name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    - name: Remove unused directories
      run: |
        rm -rf app/src/main/res
        rm -rf app/src/main/java/com/example/sampleapp

    - name: Create file_paths.xml
      run: |
        mkdir -p app/src/main/res/xml
        printf '<?xml version="1.0" encoding="utf-8"?>\n<paths>\n    <cache-path name="reports" path="reports/" />\n</paths>\n' > app/src/main/res/xml/file_paths.xml

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.7

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
