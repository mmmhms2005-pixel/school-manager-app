name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    - name: Remove unused directories
      run: |
        rm -rf app/src/main/res
        rm -rf app/src/main/java/com/example/sampleapp

    - name: Create file_paths.xml
      run: |
        mkdir -p app/src/main/res/xml
        printf '<?xml version="1.0" encoding="utf-8"?>\n<paths>\n    <cache-path name="reports" path="reports/" />\n</paths>\n' > app/src/main/res/xml/file_paths.xml

    - name: Create App Icon
      run: |
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/mipmap-anydpi-v26
        mkdir -p app/src/main/res/values
        printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#1E40AF</color>\n</resources>\n' > app/src/main/res/values/colors.xml
        printf '<?xml version="1.0" encoding="utf-8"?>\n<vector xmlns:android="http://schemas.android.com/apk/res/android"\n    android:width="108dp" android:height="108dp"\n    android:viewportWidth="108" android:viewportHeight="108">\n    <path android:fillColor="#FFFFFF" android:pathData="M15,62 C30,56 45,56 54,63 C63,56 78,56 93,62 L93,88 C78,82 63,82 54,89 C45,82 30,82 15,88 Z"/>\n    <path android:fillColor="#1E40AF" android:pathData="M52.5,63 L55.5,63 L55.5,89 L52.5,89 Z"/>\n    <path android:fillColor="#FBBF24" android:pathData="M54,22 L18,40 L54,54 L90,40 Z"/>\n    <path android:fillColor="#FCD34D" android:pathData="M34,46 L34,60 C34,60 54,68 74,60 L74,46 L54,54 Z"/>\n    <path android:fillColor="#FBBF24" android:pathData="M88,40 L90,40 L90,60 L88,60 Z"/>\n    <path android:fillColor="#FBBF24" android:pathData="M85,60 L93,60 L93,65 L85,65 Z"/>\n</vector>\n' > app/src/main/res/drawable/ic_launcher_foreground.xml
        printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@drawable/ic_launcher_foreground"/>\n</adaptive-icon>\n' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
        cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.7

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
